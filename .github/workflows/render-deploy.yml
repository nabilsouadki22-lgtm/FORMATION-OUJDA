name: Render Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Trigger Render backend deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo 'Missing Render API key.'
            exit 1
          fi
          SERVICE_ID="${RENDER_BACKEND_SERVICE_ID:-$RENDER_SERVICE_ID}"
          if [ -z "$SERVICE_ID" ]; then
            echo 'Missing Render backend service ID or generic RENDER_SERVICE_ID.'
            exit 1
          fi
          curl -X POST "https://api.render.com/deploy/${SERVICE_ID}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json"

      - name: Trigger Render frontend deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_FRONTEND_SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo 'Missing Render API key.'
            exit 1
          fi
          SERVICE_ID="${RENDER_FRONTEND_SERVICE_ID:-$RENDER_SERVICE_ID}"
          if [ -z "$SERVICE_ID" ]; then
            echo 'Missing Render frontend service ID or generic RENDER_SERVICE_ID.'
            exit 1
          fi
          curl -X POST "https://api.render.com/deploy/${SERVICE_ID}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json"
