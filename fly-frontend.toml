# Fly.io configuration for frontend
app = "formation-oujda-frontend"
primary_region = "fra"  # Frankfurt (Europe)

[build]
dockerfile = "frontend.Dockerfile"

[env]
VITE_API_URL = "https://formation-oujda-backend.fly.dev"

[[services]]
internal_port = 5173
protocol = "tcp"

[[services.ports]]
port = 80
handlers = ["http"]
force_https = true

[[services.ports]]
port = 443
handlers = ["tls", "http"]

[checks]
[checks.http]
type = "http"
interval = "10s"
timeout = "5s"
grace_period = "30s"
method = "GET"
path = "/"
