# Fly.io configuration for frontend
app = "CentreFormationOujda-frontend"
primary_region = "iad"  # Ashburn, Virginia (US)

[build]
dockerfile = "frontend.Dockerfile"

[build.args]
VITE_API_BASE = "https://CentreFormationOujda-backend.fly.dev"

[env]
VITE_API_BASE = "https://CentreFormationOujda-backend.fly.dev"

[[services]]
internal_port = 5173
protocol = "tcp"

[[services.ports]]
port = 80
handlers = ["http"]
force_https = true

[[services.ports]]
port = 443
handlers = ["tls", "http"]

[checks]
[checks.http]
type = "http"
interval = "10s"
timeout = "5s"
grace_period = "30s"
method = "GET"
path = "/"
port = 5173
